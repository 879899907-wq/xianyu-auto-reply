name: 生产环境自动部署

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: xianyu-auto-reply

jobs:
  # ── 第一步：构建并推送 Docker 镜像 ─────────────────────────────────
  build-and-push:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（多平台支持）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 第二步：SSH 部署到生产服务器 ──────────────────────────────────
  deploy:
    name: 部署到生产服务器
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    permissions:
      contents: read

    steps:
      - name: 检出代码（获取 compose 文件）
        uses: actions/checkout@v4

      - name: 通过 SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        env:
          # 镜像地址，由上一步输出
          DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          # 部署路径，通过 Repository Secret DEPLOY_PATH 配置，默认 /opt/xianyu-auto-reply
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/xianyu-auto-reply' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DOCKER_IMAGE,ADMIN_PASSWORD,JWT_SECRET_KEY,GHCR_TOKEN,GHCR_USER,DEPLOY_PATH
          script: |
            set -e

            # ── 进入部署目录 ──
            mkdir -p "${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            # ── 同步必要的配置文件（如首次部署）──
            # 将 .env.example、docker-compose.prod.yml、nginx 目录同步到服务器
            # 这些文件已通过 git checkout 存在于 runner，但需要手动 scp 或提前存在服务器上。
            # 推荐方式：首次手动执行 `git clone <repo> /opt/xianyu-auto-reply` 完成初始化，
            # 后续由此 CI 流程自动更新配置并重启服务。

            # ── 登录 GHCR（通过环境变量，避免 token 写入 shell 历史）──
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # ── 拉取最新镜像 ──
            docker pull "${DOCKER_IMAGE}"

            # ── 创建持久化目录 ──
            mkdir -p data logs backups nginx/ssl nginx/logs

            # ── 写入/更新 .env（仅覆盖关键密钥，其余变量保留）──
            if [ ! -f .env ]; then
              # 首次部署：从模板创建，如模板不存在则写入最小必要变量
              if [ -f .env.example ]; then
                cp .env.example .env
              else
                cat > .env << 'ENV'
            ADMIN_USERNAME=admin
            ADMIN_PASSWORD=PLACEHOLDER
            JWT_SECRET_KEY=PLACEHOLDER
            TZ=Asia/Shanghai
            LOG_LEVEL=INFO
            DEBUG=false
            ENV
              fi
            fi

            # 使用 set_env 函数：若变量行存在则替换，否则追加
            set_env() {
              local key="$1"
              local value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                echo "${key}=${value}" >> .env
              fi
            }

            set_env "ADMIN_PASSWORD" "${ADMIN_PASSWORD}"
            set_env "JWT_SECRET_KEY" "${JWT_SECRET_KEY}"
            # 指向 CI 构建的镜像，跳过本地 build
            set_env "DOCKER_IMAGE" "${DOCKER_IMAGE}"

            # ── 使用生产 compose 部署（不重新构建镜像）──
            docker compose -f docker-compose.prod.yml up -d --no-build

            # ── 清理旧镜像 ──
            docker image prune -f

            echo "✅ 部署完成！"
